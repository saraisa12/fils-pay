name: Deploy to Aya DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aya-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.AYA_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.AYA_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.AYA_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Verify the server host key using a trusted fingerprint
          # before enabling the SSH connection.
          echo "SSH key configured"

      - name: Deploy FilsPay
        env:
          SSH_HOST: ${{ secrets.AYA_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.AYA_DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            '/home/dilmune/deploy.sh'
