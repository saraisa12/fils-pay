name: Deploy to Aya DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aya-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.AYA_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AYA_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy FilsPay to DigitalOcean
        env:
          SSH_HOST: ${{ secrets.AYA_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.AYA_DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            '/home/dilmune/deploy.sh'
